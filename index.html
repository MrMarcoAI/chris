<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<title>CHRIS</title>
<meta name="apple-mobile-web-app-title" content="CHRIS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon.png?v=2">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 class="titulo">
    <span class="logo" role="img" aria-label="CHRIS"></span>
    <span id="fecha"></span>
  </h1>
  <button id="theme-btn" class="glass" aria-label="Cambiar tema">◐</button>
</header>

<div id="clue-bar" class="glass">
  <button id="prev-word" aria-label="Palabra anterior">‹</button>
  <div id="clue-text"></div>
  <button id="next-word" aria-label="Palabra siguiente">›</button>
</div>

<div id="grid-wrap">
  <div id="grid"></div>
  <input id="kbd" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="characters" spellcheck="false" enterkeyhint="next"
         aria-label="Entrada de letras">
</div>

<div id="banner" hidden>✓ Crucigrama completado</div>

<section class="clues">
  <h2>Horizontales</h2>
  <ul id="across-list"></ul>
  <h2>Verticales</h2>
  <ul id="down-list"></ul>
</section>

<footer id="temas"></footer>

<nav id="levels" class="glass" role="tablist">
  <span class="pill" aria-hidden="true"></span>
  <button data-level="facil" role="tab">PAPA</button>
  <button data-level="medio" role="tab">TRANQUI</button>
  <button data-level="dificil" role="tab">PELÚO</button>
</nav>

<script src="puzzles.js"></script>
<script src="app.js"></script>
</body>
</html>
